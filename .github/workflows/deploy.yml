name: Deploy Quant Agent to Raspberry Pi

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest changes, install dependencies, and restart service
        run: |
          cd /home/tmalone1250/crypto-trading-bot
          git pull
          source venv/bin/activate
          pip install -r requirements.txt
          sudo systemctl restart quant_agent
